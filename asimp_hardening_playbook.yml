---
- name: Run local ASIMP Security Hardening and Compliance Audits
  hosts: localhost
  connection: local
  gather_facts: true
  become: true
  vars:
    security_enable_firewalld: false
    security_rhel7_initialize_aide: false
    security_rhel7_enable_auditd: false
    security_rhel7_enable_chrony: false
    security_contrib_enabled: true
    security_rhel7_audit_failure_flag: 1
    security_ntp_servers:
      - ntp1.sirim.my
      - ntp2.sirim.my
    upgrade_ubuntu_check: false
    dist_upgrade_ubuntu_check: false
    debsums_ubuntu_check: true
    lynis_use_packages: true
    lynis_audit_system_linux: true
    ssh_kex:
      - curve25519-sha256
      - curve25519-sha256@libssh.org
      - diffie-hellman-group-exchange-sha256

  tasks:
    - name: Run BEFORE Hardening Audits (OpenSCAP & Lynis)
      ansible.builtin.include_role:
        name: reporting-ASIMP
      vars:
        reporting_phase: before

    - name: Apply Ubuntu Update Hardening
      ansible.builtin.include_role:
        name: update-ubuntu-ASIMP
      when: ansible_distribution == 'Ubuntu' or ansible_os_family == 'Debian'

    - name: Apply OpenStack System Hardening
      ansible.builtin.include_role:
        name: ansible-hardening

    - name: Apply SSH Hardening
      ansible.builtin.include_role:
        name: dev-sec.ssh-hardening

    - name: Apply Lynis Hardening Configuration
      ansible.builtin.include_role:
        name: lynis-ansible

    - name: Run AFTER Hardening Audits (OpenSCAP & Lynis)
      ansible.builtin.include_role:
        name: reporting-ASIMP
      vars:
        reporting_phase: after

    - name: Read ASIMP Baseline Scores
      ansible.builtin.slurp:
        src: /var/log/asimp-baseline-scores.json
      register: baseline_scores_raw

    - name: Parse ASIMP Baseline Scores Fact
      ansible.builtin.set_fact:
        baseline_scores: "{{ baseline_scores_raw.content | b64decode | from_json }}"

    - name: Parse Lynis AFTER hardening index
      ansible.builtin.shell: grep -E "^hardening_index=" /var/log/lynis-report.dat | cut -d'=' -f2
      register: raw_lynis_after
      changed_when: false

    - name: Parse OpenSCAP AFTER compliance score
      ansible.builtin.shell: python3 /usr/local/bin/parse_openscap_score.py /var/log/openscap-after-results.xml
      register: raw_openscap_after
      changed_when: false
      failed_when: false

    - name: Establish Score Facts for Templates
      ansible.builtin.set_fact:
        lynis_before_score: "{{ baseline_scores.lynis_before | default('0') | trim }}"
        lynis_after_score: "{{ raw_lynis_after.stdout | default('0') | trim }}"
        openscap_before_score: "{{ baseline_scores.openscap_before | default('0.0') | trim }}"
        openscap_after_score: "{{ raw_openscap_after.stdout | default('0.0') | trim }}"

    - name: Generate OKF v0.1-Compliant Hardening Markdown Report
      ansible.builtin.template:
        src: templates/asimp_report.md.j2
        dest: docs/asimp-hardening-report.md
        owner: root
        group: root
        mode: '0644'

    - name: Generate OKF v0.1-Compliant Hardening HTML Report
      ansible.builtin.template:
        src: templates/asimp_report.html.j2
        dest: docs/asimp-hardening-report.html
        owner: root
        group: root
        mode: '0644'

    - name: Update Sidebar Navigation inside Existing HTML files
      ansible.builtin.command:
        cmd: python3 scripts/update_sidebars.py
      changed_when: true
