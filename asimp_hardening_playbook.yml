---
- name: Pre-Remediation Safety Check & Break-Prevention Verification
  hosts: localhost
  connection: local
  gather_facts: true
  tasks:
    - name: Run Privilege and Remediation Safety Gate script
      ansible.builtin.command:
        cmd: python3 scripts/privilege_and_safety_test.py
      changed_when: false

    - name: Read Privilege and Safety Assessment Report
      ansible.builtin.slurp:
        src: "{{ playbook_dir }}/data/privilege_and_safety_report.json"
      register: priv_safety_raw

    - name: Set Privilege and Safety level facts
      ansible.builtin.set_fact:
        asimp_privilege_level: "{{ (priv_safety_raw.content | b64decode | from_json).privileges.asimp_privilege_level | default('limited_sandbox') }}"
        asimp_risk_level: "{{ (priv_safety_raw.content | b64decode | from_json).safety.risk_level | default('LOW_RISK') }}"

    - name: Pre-Remediation Safety Check & Break-Prevention Verification Block
      block:
        - name: Print safety assessment check status
          ansible.builtin.debug:
            msg: "Pre-Remediation Safety Check & Break-Prevention Verification initiated on full-privilege system."

        - name: Verify no critical risk factors that would break the system or access
          ansible.builtin.assert:
            that:
              - asimp_risk_level not in ['CRITICAL_RISK', 'HIGH_RISK']
            fail_msg: "Pre-Remediation Safety Check failed: High or Critical risk of system breakage detected. Aborting modifications!"
      when:
        - asimp_privilege_level == 'full_privilege'
        - not (skip_remediation | default(false) | bool)

- name: Import ASIMP Localhost Hardening Playbook
  ansible.builtin.import_playbook: asimp/play-localhost.yml
  when: not (is_limited_environment | default(false) | bool)

- name: Generate report and update sidebar
  hosts: localhost
  connection: local
  gather_facts: true
  become: "{{ not (is_limited_environment | default(false) | bool) }}"
  tasks:
    - name: Check if ASIMP-level mock logs exist in asimp/data/asimp_mock
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/asimp/data/asimp_mock/var/log/asimp-baseline-scores.json"
      register: asimp_mock_stat

    - name: Set log and report directory facts
      ansible.builtin.set_fact:
        asimp_log_dir: >-
          {%- if not (is_limited_environment | default(false) | bool) and not (skip_remediation | default(false) | bool) -%}
          /var/log
          {%- elif asimp_mock_stat.stat.exists -%}
          {{ playbook_dir }}/asimp/data/asimp_mock/var/log
          {%- else -%}
          {{ playbook_dir }}/data/asimp_mock/var/log
          {%- endif -%}
        asimp_openscap_results: >-
          {%- if not (is_limited_environment | default(false) | bool) and not (skip_remediation | default(false) | bool) -%}
          /var/log/openscap-after-results.xml
          {%- elif asimp_mock_stat.stat.exists -%}
          {{ playbook_dir }}/asimp/data/asimp_mock/var/log/openscap-after-results.xml
          {%- else -%}
          {{ playbook_dir }}/data/asimp_mock/var/log/openscap-after-results.xml
          {%- endif -%}

    - name: Read ASIMP Baseline Scores
      ansible.builtin.slurp:
        src: "{{ asimp_log_dir }}/asimp-baseline-scores.json"
      register: baseline_scores_raw

    - name: Parse ASIMP Baseline Scores Fact
      ansible.builtin.set_fact:
        baseline_scores: "{{ baseline_scores_raw.content | b64decode | from_json }}"

    - name: Read Privilege and Safety Assessment Report
      ansible.builtin.slurp:
        src: "{{ playbook_dir }}/data/privilege_and_safety_report.json"
      register: priv_safety_raw
      failed_when: false

    - name: Parse Privilege and Safety Report Fact
      ansible.builtin.set_fact:
        priv_safety: "{{ priv_safety_raw.content | b64decode | from_json if priv_safety_raw.content is defined else {} }}"

    - name: Parse Lynis AFTER hardening index
      ansible.builtin.shell: "grep -E '^hardening_index=' {{ asimp_log_dir }}/lynis-report.dat | cut -d'=' -f2"
      register: raw_lynis_after
      changed_when: false
      failed_when: false

    - name: Parse OpenSCAP AFTER compliance score using inline python
      ansible.builtin.shell: |
        python3 -c "
        import xml.etree.ElementTree as ET, sys
        try:
            tree = ET.parse('{{ asimp_openscap_results }}')
            root = tree.getroot()
            ns = {'x12': 'http://checklists.nist.gov/xccdf/1.2', 'x11': 'http://checklists.nist.gov/xccdf/1.1'}
            elem = root.find('.//x12:score', ns) or root.find('.//x11:score', ns)
            if elem is not None:
                print(round(float(elem.text), 2))
            else:
                res = [e.text for e in root.findall('.//x12:result', ns) or root.findall('.//x11:result', ns)]
                total = res.count('pass') + res.count('fail')
                print(round(res.count('pass')/total*100, 2) if total > 0 else '0.0')
        except Exception:
            print('0.0')
        "
      register: raw_openscap_after
      changed_when: false
      failed_when: false

    - name: Establish Score Facts for Templates
      ansible.builtin.set_fact:
        lynis_before_score: "{{ baseline_scores.lynis_before | default('62') | trim }}"
        lynis_after_score: "{{ raw_lynis_after.stdout | trim if (raw_lynis_after.stdout is defined and raw_lynis_after.stdout | trim | length > 0) else (baseline_scores.lynis_after | default('59') | trim) }}"
        openscap_before_score: "{{ baseline_scores.openscap_before | default('58.4') | trim }}"
        openscap_after_score: "{{ raw_openscap_after.stdout | trim if (raw_openscap_after.stdout is defined and raw_openscap_after.stdout | trim | length > 0) else (baseline_scores.openscap_after | default('0.0') | trim) }}"
        host_privilege_level: "{{ priv_safety.privileges.privilege_level | default('UNKNOWN') }}"
        host_remediation_risk: "{{ priv_safety.safety.risk_level | default('UNKNOWN') }}"
        remediation_skipped: "{{ skip_remediation | default(is_limited_environment | default(false)) | bool }}"

    - name: Generate OKF v0.1-Compliant Hardening Markdown Report
      ansible.builtin.template:
        src: templates/asimp_report.md.j2
        dest: docs/asimp-hardening-report.md
        owner: "{{ 'root' if not (is_limited_environment | default(false) | bool) else omit }}"
        group: "{{ 'root' if not (is_limited_environment | default(false) | bool) else omit }}"
        mode: '0644'

    - name: Generate OKF v0.1-Compliant Hardening HTML Report
      ansible.builtin.template:
        src: templates/asimp_report.html.j2
        dest: docs/asimp-hardening-report.html
        owner: "{{ 'root' if not (is_limited_environment | default(false) | bool) else omit }}"
        group: "{{ 'root' if not (is_limited_environment | default(false) | bool) else omit }}"
        mode: '0644'

    - name: Update Sidebar Navigation inside Existing HTML files
      ansible.builtin.command:
        cmd: python3 scripts/update_sidebars.py
      changed_when: true
