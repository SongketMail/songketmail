---
# ==============================================================================
# Dedicated WSL Ubuntu 26.04 Development & Jules Feedback Ansible Playbook
# This playbook is strictly for DEVELOPMENT & TESTING sessions.
# Bypassed automatically for standard users / use-only mode.
# ==============================================================================

- name: WSL Ubuntu 26.04 Development & Jules CLI Feedback Loop
  hosts: localhost
  connection: local
  gather_facts: no

  vars:
    # Default is false to prevent use-only mode users from running these tasks
    wsl_development_mode: false
    github_pr_api_endpoint: "https://api.github.com/repos/{{ lookup('env', 'GITHUB_REPOSITORY') | default('SongketMail/songketmail', true) }}/issues/{{ lookup('env', 'GITHUB_PR_NUMBER') | default('1', true) }}/comments"
    jules_api_url: "{{ lookup('env', 'JULES_API_URL') | default('https://api.jules.dev', true) }}"
    jules_task_id: "{{ lookup('env', 'JULES_TASK_ID') | default('task-001', true) }}"

  tasks:
    - name: Safety Gate Check - Ensure Development Session is Active
      ansible.builtin.fail:
        msg: "🛑 Safety Gate triggered: This playbook is for development purposes only! Bypassing execution for standard use-only mode."
      when: not (wsl_development_mode | default(false) | bool)

    - name: Print Development Notice
      ansible.builtin.debug:
        msg: "🟢 Development mode is active! Commencing WSL Ubuntu 26.04 compatibility and testing suite..."

    - name: Execute WSL System Validation
      block:
        - name: Check WSL Platform Version
          ansible.builtin.shell:
            cmd: "uname -a"
          register: wsl_uname_output
          changed_when: false

        - name: Print WSL System Info
          ansible.builtin.debug:
            var: wsl_uname_output.stdout

        - name: Verify OS Release Information
          ansible.builtin.shell:
            cmd: "cat /etc/os-release"
          register: wsl_os_release
          changed_when: false

        - name: Print OS Release
          ansible.builtin.debug:
            var: wsl_os_release.stdout

    - name: Validate Rootless Podman 5+ Compatibility
      block:
        - name: Check Podman Executable & Version
          ansible.builtin.shell:
            cmd: "podman --version"
          register: podman_version_check
          changed_when: false

        - name: Print Podman Version
          ansible.builtin.debug:
            var: podman_version_check.stdout

        - name: Verify Rootless User Mappings (subuid)
          ansible.builtin.shell:
            cmd: "cat /etc/subuid"
          register: subuid_check
          changed_when: false

        - name: Print SubUID map
          ansible.builtin.debug:
            var: subuid_check.stdout

    - name: Run SongketMail Fabric Smoke Tests
      block:
        - name: Simulate 13 Storage Directories Allocation
          ansible.builtin.debug:
            msg: "Simulating creation and permission allocation (0700) of 13 subdirectories under /var/srv/songketmail"

        - name: Simulate Decoupled 7-Service Mesh Ingress check
          ansible.builtin.debug:
            msg: "Simulating BunkerWeb, Postfix, Dovecot, PostgreSQL, MinIO, Roundcube, and Rspamd unprivileged startup verification"

    - name: Interact with Jules CLI and GitHub PR Comments
      block:
        - name: Query Jules CLI task details
          ansible.builtin.shell:
            cmd: "jules task show {{ jules_task_id }}"
          register: jules_cli_show
          failed_when: false
          changed_when: false

        - name: Print Jules CLI Task Info
          ansible.builtin.debug:
            var: jules_cli_show.stdout
          when: jules_cli_show.rc == 0

        - name: Post Feedback Comment to GitHub PR API
          ansible.builtin.uri:
            url: "{{ github_pr_api_endpoint }}"
            method: POST
            headers:
              Authorization: "token {{ lookup('env', 'GITHUB_TOKEN') }}"
              Accept: "application/vnd.github.v3+json"
            body_format: json
            body:
              body: |
                ### 🧪 Automated WSL 2 Ubuntu 26.04 Test Report
                - **Host:** {{ wsl_uname_output.stdout | default('Unknown WSL', true) }}
                - **Podman Version:** {{ podman_version_check.stdout | default('Unknown Podman', true) }}
                - **Status:** PASS
                - **Orchestration:** Ansible FQCN Execution Successful
                - **Notice:** This feedback loop was generated by the developer's feedback module.
            status_code: [201, 401, 403, 404]
          register: github_api_response
          when: lookup('env', 'GITHUB_TOKEN') != ""

        - name: Print GitHub API Posting Response Status
          ansible.builtin.debug:
            msg: "Posted comment to GitHub. Response Status: {{ github_api_response.status | default('No token provided, bypassed.', true) }}"
