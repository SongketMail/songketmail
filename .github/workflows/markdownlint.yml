name: MarkdownLint & Code Block Spacing Compliance

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdownlint:
    name: MarkdownLint Check (MD031 Enforcer)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js Environment
        uses: actions/setup-node@39370e3970a6d050c08020d06ec3e029631bb7af # v4.1.0
        with:
          node-version: "20"

      - name: Run MarkdownLint CLI
        run: |
          npx markdownlint-cli@0.44.0 --config .markdownlint.json "**/*.md" --ignore node_modules
