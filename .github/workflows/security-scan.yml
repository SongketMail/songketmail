name: Container Security & Vulnerability Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run Trivy Vulnerability Scanner (Repo & Config Scan)
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Discover & Scan Deployed Quadlet Container Images
        run: |
          echo "Extracting container images from roles/podman_quadlet/templates/*.container..."
          IMAGES=$(grep -h "^Image=" roles/podman_quadlet/templates/*.container | cut -d'=' -f2 | tr -d ' "' | sort -u)
          echo "Discovered Quadlet container images:"
          echo "${IMAGES}"
          for img in ${IMAGES}; do
            # Resolve Jinja variables using group_vars/all.yml defaults
            CLEAN_IMG=$(echo "${img}" | sed \
              -e 's/{{ dovecot_image_tag }}/2.3.21.1/g' \
              -e 's/{{dovecot_image_tag}}/2.3.21.1/g' \
              -e 's/{{ postfix_image_tag }}/3.9.0/g' \
              -e 's/{{postfix_image_tag}}/3.9.0/g' \
              -e 's/{{ bunkerweb_image_tag }}/1.6.13/g' \
              -e 's/{{bunkerweb_image_tag}}/1.6.13/g' \
              -e 's/{{ rspamd_image_tag }}/3.9.1/g' \
              -e 's/{{rspamd_image_tag}}/3.9.1/g' \
              -e 's/{{ rustfs_image_tag }}/1.0.0/g' \
              -e 's/{{rustfs_image_tag}}/1.0.0/g' \
              -e 's/{{ smallstep_image_tag }}/0.26.1/g' \
              -e 's/{{smallstep_image_tag}}/0.26.1/g' \
              -e 's/{{ roundcube_image_tag }}/1.6.8-apache/g' \
              -e 's/{{roundcube_image_tag}}/1.6.8-apache/g' | sed -E 's/\{\{.*\}\}/latest/g')
            echo "Scanning Quadlet container image: ${CLEAN_IMG}"
            npx --yes trivy image --severity CRITICAL,HIGH --exit-code 0 "${CLEAN_IMG}" || true
          done
