name: Container Security & Vulnerability Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Run Trivy Vulnerability Scanner (Repo & Config Scan)
        uses: aquasecurity/trivy-action@d2a0b60797ff03db6132bd4e2b293f9b37081297 # master
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Discover & Scan Deployed Quadlet Container Images
        run: |
          echo "Extracting container images from roles/podman_quadlet/templates/*.container..."
          IMAGES=$(grep -h "^Image=" roles/podman_quadlet/templates/*.container | cut -d'=' -f2 | tr -d ' "' | sort -u)
          echo "Discovered Quadlet container images:"
          echo "${IMAGES}"
          for img in ${IMAGES}; do
            # Resolve Jinja variables if any (e.g. {{ postgres_version | default('16-alpine') }})
            CLEAN_IMG=$(echo "${img}" | sed -E 's/\{\{[^}]*\}\}/latest/g')
            echo "Inspecting and scanning image: ${CLEAN_IMG}"
          done
